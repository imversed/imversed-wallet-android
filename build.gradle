// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        agpVersion = '8.13.2'
        kotlinVersion = '2.3.21'
        lightsaberVersion = '1.0.0-alpha23'
        protobufVersion = '3.25.5'
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agpVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "com.google.protobuf:protobuf-java:$protobufVersion"
        // alpha23 is the newest Lightsaber that runs on the Kotlin stdlib Gradle embeds;
        // alpha26+ call stdlib APIs that only exist in Kotlin 2.4 and fail in the class transform.
        classpath "com.joom.lightsaber:lightsaber-gradle-plugin:$lightsaberVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven { url 'https://jitpack.io' }
        maven {
            url "http://office.dmiche.com:8083"
            allowInsecureProtocol = true
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
