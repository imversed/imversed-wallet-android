apply plugin: "kotlin"

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

kotlin {
    jvmToolchain(17)
}

tasks.withType(JavaCompile).configureEach {
    // This module is ~3M lines of generated protobuf/gRPC Java. Compiled inside the Gradle
    // daemon, javac's AST competes for the same heap as D8 (:app:mergeExtDex runs in
    // parallel with it), and release builds die with OutOfMemoryError. Give javac its own
    // JVM so the two no longer share a heap. It needs a little under 1 GB on its own.
    options.fork = true
    options.forkOptions.jvmArgs = ['-Xmx2g']
}

dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    // bitcoin
    // Held at 0.15.2 deliberately: it is what every existing wallet's addresses were
    // derived with, and it only works against BouncyCastle 1.60 (later releases drop
    // ECPoint.isCompressed()). Moving off it means moving to bitcoinj 0.16.x, which
    // changes the ECKey/DeterministicKey API and needs derivation re-verified against
    // known addresses before release.
    api 'org.bitcoinj:bitcoinj-core:0.15.2'
    //for ed25519
    api 'net.i2p.crypto:eddsa:0.3.0'
    //Grpc and protobuf
    api 'io.grpc:grpc-okhttp:1.62.2'
    api ('io.grpc:grpc-protobuf:1.62.2') {
        exclude group: 'com.google.api'
        exclude group: 'com.google.protobuf.GoGoProtos', module: "protobuf-java"
        exclude group: 'com.google.protobuf.AnyProto', module: "protobuf-java"
        exclude group: 'com.google.protobuf.AnyOrBuilder', module: "protobuf-java"
    }
    api 'io.grpc:grpc-stub:1.62.2'
    api 'javax.annotation:javax.annotation-api:1.3.2'

}
